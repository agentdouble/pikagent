name: Windows Release Assets

on:
  push:
    branches:
      - windows-compatibility
    paths:
      - ".github/workflows/windows-release-assets.yml"
      - "package.json"
      - "package-lock.json"
      - "main/**"
      - "src/**"
      - "bin/**"
      - "shared/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to receive Windows assets"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  upload-windows-assets:
    name: Build and upload Windows installer
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm config set msvs_version 2022
          npm ci

      - name: Build Windows package
        run: npm run package:win

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || 'v1.0.1' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $patterns = @(
            "*.exe",
            "*.exe.blockmap",
            "*-win.zip",
            "*-win.zip.blockmap",
            "latest.yml"
          )
          $assets = foreach ($pattern in $patterns) {
            Get-ChildItem -Path release -File -Filter $pattern | Select-Object -ExpandProperty FullName
          }
          $assets = @($assets | Sort-Object -Unique)

          if (-not $assets -or $assets.Count -eq 0) {
            throw "No Windows release assets found in release/"
          }

          $assets | ForEach-Object { Write-Host "Uploading $_" }
          gh release upload $env:RELEASE_TAG @assets --clobber

name: Windows Compatibility

on:
  push:
    branches:
      - windows-compatibility
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/windows-compatibility.yml"
      - "main/**"
      - "src/**"
      - "bin/**"
      - "shared/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Test and package on Windows
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build renderer bundle
        run: npm run build

      - name: Package Windows app
        run: npm run package:win
